name: External Link Check

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

jobs:
  external-links:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check external links
        shell: pwsh
        run: ./scripts/check-external-links.ps1 -Root .
