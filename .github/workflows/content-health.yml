name: Content Health Report

on:
  workflow_dispatch:
  schedule:
    - cron: "20 2 * * 1"

permissions:
  contents: read

jobs:
  content-health:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate content health report
        shell: pwsh
        run: ./scripts/content-health-report.ps1 -Root . -OutputPath content-health-report.md

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: content-health-report
          path: content-health-report.md
