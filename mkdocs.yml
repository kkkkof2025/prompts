site_name: AI 学习方法全景书
site_description: 从对话、prompt、skills 到 agent、OpenClaw、Hermes、HiMeS 与 AI 前沿发展的中文开源书
site_url: https://kkkkof2025.github.io/prompts/
repo_url: https://github.com/kkkkof2025/prompts
repo_name: kkkkof2025/prompts
edit_uri: edit/master/
docs_dir: .
site_dir: ../prompts-site
exclude_docs: |
  site/
  _site/
  dist/
  build/
  node_modules/
  vendor/
  tmp/
  temp/
  .git/
  .github/
  .workbuddy/
  README.md
  scripts/
  mkdocs.yml
  requirements-docs.txt
  content-health-report.md
  .markdownlint.json
  .gitignore
theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - navigation.instant
    - navigation.instant.progress
    - toc.follow
    - content.action.edit
    - content.action.view
    - content.code.copy
    - search.highlight
    - search.suggest
    - search.share
  palette:
    - scheme: default
      primary: blue
      accent: green
extra_css:
  - docs/stylesheets/extra.css
plugins:
  - search:
      lang:
        - zh
        - en
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
nav:
  - 首页: index.md
  - 书稿首页: docs/index.md
  - 完整目录: docs/SUMMARY.md
  - 主体章节:
      - 第 0 章：学习路线图: docs/chapters/00-learning-map.md
      - 第 1 章：从最基本的对话开始: docs/chapters/01-dialogue-basics.md
      - 第 2 章：AI 的基本概念: docs/chapters/02-ai-basics.md
      - 第 3 章：Prompt 入门: docs/chapters/03-prompt-basics.md
      - 第 4 章：结构化 Prompt 与工作流: docs/chapters/04-prompt-workflows.md
      - 第 5 章：模型选择、验证与评估: docs/chapters/05-evaluation.md
      - 第 6 章：工具调用、RAG 与知识库: docs/chapters/06-tools-rag.md
      - 第 7 章：Skills，把经验固化成能力: docs/chapters/07-skills.md
      - 第 8 章：Agent，从聊天到行动: docs/chapters/08-agents.md
      - 第 9 章：记忆系统与个性化助手: docs/chapters/09-memory.md
      - 第 10 章：OpenClaw 与个人 AI 助手工作台: docs/chapters/10-openclaw.md
      - 第 11 章：Hermes、HiMeS 与开源模型路线: docs/chapters/11-hermes-himes-open-models.md
