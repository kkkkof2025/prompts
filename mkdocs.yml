site_name: AI 学习方法全景书
site_description: 从对话、prompt、skills 到 agent、OpenClaw、Hermes、HiMeS 与 AI 前沿发展的中文开源书
site_url: https://kkkkof2025.github.io/prompts/mkdocs/
repo_url: https://github.com/kkkkof2025/prompts
repo_name: kkkkof2025/prompts
docs_dir: docs
site_dir: site/mkdocs
theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
  palette:
    - scheme: default
      primary: blue
      accent: green
extra_css:
  - stylesheets/extra.css
plugins:
  - search:
      lang:
        - zh
        - en
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
nav:
  - 首页: index.md
  - 完整目录: SUMMARY.md
  - 主体章节:
      - 第 0 章：学习路线图: chapters/00-learning-map.md
      - 第 1 章：从最基本的对话开始: chapters/01-dialogue-basics.md
      - 第 2 章：AI 的基本概念: chapters/02-ai-basics.md
      - 第 3 章：Prompt 入门: chapters/03-prompt-basics.md
      - 第 4 章：结构化 Prompt 与工作流: chapters/04-prompt-workflows.md
      - 第 5 章：模型选择、验证与评估: chapters/05-evaluation.md
      - 第 6 章：工具调用、RAG 与知识库: chapters/06-tools-rag.md
      - 第 7 章：Skills，把经验固化成能力: chapters/07-skills.md
      - 第 8 章：Agent，从聊天到行动: chapters/08-agents.md
      - 第 9 章：记忆系统与个性化助手: chapters/09-memory.md
      - 第 10 章：OpenClaw 与个人 AI 助手工作台: chapters/10-openclaw.md
      - 第 11 章：Hermes、HiMeS 与开源模型路线: chapters/11-hermes-himes-open-models.md
      - 第 12 章：AI 前沿发展全景: chapters/12-frontier-landscape.md
      - 第 13 章：安全、伦理与治理: chapters/13-safety-governance.md
